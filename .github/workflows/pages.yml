name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js for checks
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check settings and STL output
        run: node --test tests/app.test.cjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp BioBuzz_Scoop_Generator.html _site/index.html
          cp BioBuzz_Scoop_Generator.html BioBuzz-Fin-Studio.html FTC-Alliance-Plate.html _site/
          cp -R examples _site/examples

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
